name: Synchroniser les matchs — préproduction

on:
  workflow_dispatch:
    inputs:
      diagnostic_calendrier:
        description: Tester la navigation publique du calendrier U15F
        type: boolean
        default: false
  push:
    branches:
      - staging
    paths:
      - 'scripts/sync-matches.mjs'
      - 'scripts/fff-*.mjs'
      - 'scripts/standings-integrated.mjs'

concurrency:
  group: sync-matches-staging
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !inputs.diagnostic_calendrier }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code staging
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'staging' }}

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Synchroniser les matchs en préproduction
        run: node scripts/sync-matches.mjs
        env:
          FCE_ALLOW_PARTIAL_MATCH_IMPORT: 'true'
          FCE_SITE_URL: ${{ secrets.FCE_STAGING_SITE_URL }}
          FCE_SYNC_TOKEN: ${{ secrets.FCE_STAGING_SYNC_TOKEN }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}


  diagnostic:
    if: ${{ inputs.diagnostic_calendrier }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'staging' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tester le passage à la semaine suivante
        run: node scripts/sync-matches.mjs --diagnostic-calendrier
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
