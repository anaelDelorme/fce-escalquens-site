name: Déployer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Appliquer les migrations D1
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Précharger la boutique si elle est réellement vide
        shell: bash
        run: |
          RESULT="$(npx wrangler d1 execute DB --remote --command "SELECT COUNT(*) AS count FROM shop_products;" --json)"

          COUNT="$(printf '%s' "$RESULT" | node -e "
            let s='';
            process.stdin.on('data',d=>s+=d);
            process.stdin.on('end',()=>{
              const data=JSON.parse(s);
              console.log(
                Number(
                  data?.[0]?.results?.[0]?.count
                  ||0
                )
              );
            });
          ")"

          echo "Articles existants : $COUNT"

          if [ "$COUNT" = "0" ]; then
            echo "Boutique vide : chargement du seed."
            npx wrangler d1 execute DB --remote --file=./seed/shop.sql
          else
            echo "Boutique déjà configurée : seed ignoré."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
