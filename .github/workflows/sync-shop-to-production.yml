name: Copier la boutique staging vers production
on:
  push:
    branches: [ops/sync-shop-production]
  workflow_dispatch:
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/ops/sync-shop-production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_ARCHIVE_PASSWORD: ${{ secrets.PRODUCTION_ARCHIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:shop
      - run: npm run build
      - name: Vérifier les destinations et la clé de sauvegarde
        run: |
          node scripts/check-production.mjs
          node scripts/production-archive.mjs --action check-key
      - name: Préparer uniquement le catalogue et les images boutique
        id: export
        run: node scripts/prepare-production.mjs --scope shop --release "preparation-$GITHUB_RUN_ID" 2>preparation-error.txt
      - name: Sauvegarder les trois bases avant toute écriture
        run: node scripts/manage-production.mjs --action backup --backup ".production-maintenance/$GITHUB_RUN_ID"
      - name: Chiffrer le catalogue préparé et les sauvegardes privées
        id: encrypt
        run: |
          node scripts/production-archive.mjs --action encrypt --source .production-maintenance --out ".production-encrypted/sauvegarde-boutique-$GITHUB_RUN_ID.fce"
          node scripts/production-archive.mjs --action encrypt --source .production-preparation --out ".production-encrypted/catalogue-boutique-$GITHUB_RUN_ID.fce"
      - uses: actions/upload-artifact@v4
        id: backups
        with:
          name: sauvegarde-copie-boutique-${{ github.run_id }}
          path: .production-encrypted/sauvegarde-boutique-${{ github.run_id }}.fce
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: artifacts
        with:
          name: catalogue-boutique-${{ github.run_id }}
          path: .production-encrypted/catalogue-boutique-${{ github.run_id }}.fce
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Copier et vérifier les images puis remplacer le catalogue
        id: apply
        env:
          BACKUP_ARTIFACT_URL: ${{ steps.backups.outputs.artifact-url }}
        run: |
          test -n "$BACKUP_ARTIFACT_URL"
          manifest_sha256=$(sha256sum ".production-preparation/preparation-$GITHUB_RUN_ID/manifest.json" | cut -d ' ' -f 1)
          node scripts/manage-production.mjs --action import-shop --folder ".production-preparation/preparation-$GITHUB_RUN_ID" --backup ".production-maintenance/$GITHUB_RUN_ID" --manifest-sha256 "$manifest_sha256"
      - name: Publier le résultat sans données privées
        if: always()
        env:
          PREPARATION_OUTCOME: ${{ steps.export.outcome }}
          PRODUCTION_OPERATION: catalogue
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          BACKUP_ARTIFACT_URL: ${{ steps.backups.outputs.artifact-url }}
          BACKUP_ARCHIVE_ENCRYPTED: ${{ steps.encrypt.outcome == 'success' && steps.backups.outcome == 'success' }}
          ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          ARCHIVE_ENCRYPTED: ${{ steps.encrypt.outcome == 'success' && steps.artifacts.outcome == 'success' }}
        run: node scripts/production-report.mjs
