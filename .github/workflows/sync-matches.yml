name: Synchroniser les matchs — production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Audit FFF sans écriture Cloudflare"
        type: boolean
        default: true
      verify_date:
        description: "Date à contrôler (AAAA-MM-JJ, facultatif)"
        type: string
        default: ""
      verify_count:
        description: "Nombre d'événements attendu ce jour (facultatif)"
        type: string
        default: ""

  schedule:
    - cron: "7 20 * * 1" # lundi 20h07
      timezone: "Europe/Paris"
  
    - cron: "7 21 * * 3" # mercredi 21h07
      timezone: "Europe/Paris"
  
    - cron: "7 21 * * 4" # jeudi 21h07
      timezone: "Europe/Paris"
  
    - cron: "7 16 * * 5" # vendredi 16h07
      timezone: "Europe/Paris"
  
    - cron: "7 9,14,16,18,20 * * 6" # samedi
      timezone: "Europe/Paris"
  
    - cron: "7 9,14,16,18,20 * * 0" # dimanche
      timezone: "Europe/Paris"

concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: read
      issues: write

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Vérifier les invariants
        run: npm run test:sync

      - name: Collecter et importer
        run: node scripts/sync-matches.mjs
        env:
          FCE_SITE_URL: ${{ secrets.FCE_SITE_URL }}
          FCE_SYNC_TOKEN: ${{ secrets.FCE_SYNC_TOKEN }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SYNC_VERIFY_DATE: ${{ inputs.verify_date }}
          SYNC_VERIFY_COUNT: ${{ inputs.verify_count }}

      - name: Ouvrir l’alerte de synchronisation
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Alerte : synchronisation des rencontres';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            if (!open.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `La synchronisation automatique a échoué ou n’est que partielle.\n\nConsultez l’exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }

      - name: Fermer l’alerte après rétablissement
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Alerte : synchronisation des rencontres';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const issue of open.filter(issue => issue.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'La synchronisation suivante a réussi. L’alerte est refermée automatiquement.'
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Conserver les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fff-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: sync-reports/
          retention-days: 30
          if-no-files-found: warn

  notify-failure:
    needs: sync
    if: always() && needs.sync.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Récupérer le bilan si disponible
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fff-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: sync-reports/
      - name: Envoyer le mail à chaque échec
        run: python3 scripts/send-sync-failure.py
        env:
          SYNC_ENV: production
          SYNC_SMTP_HOST: ${{ secrets.SYNC_SMTP_HOST }}
          SYNC_SMTP_PORT: ${{ secrets.SYNC_SMTP_PORT }}
          SYNC_SMTP_USER: ${{ secrets.SYNC_SMTP_USER }}
          SYNC_SMTP_PASSWORD: ${{ secrets.SYNC_SMTP_PASSWORD }}
          SYNC_MAIL_FROM: ${{ secrets.SYNC_MAIL_FROM }}
          SYNC_MAIL_TO: ${{ secrets.SYNC_MAIL_TO }}
