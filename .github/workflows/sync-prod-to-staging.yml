name: Recharger la préprod depuis la production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-prod-to-staging
  cancel-in-progress: false

jobs:
  clone-d1:
    name: Copier D1 prod vers préprod
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Récupérer develop
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: npm ci

      - name: Afficher les bases utilisées
        run: |
          echo "=== PRODUCTION ==="
          npx wrangler d1 info fce-escalquens

          echo
          echo "=== PREPRODUCTION ==="
          npx wrangler d1 info DB --env staging

      - name: Exporter les données de production
        run: |
          npx wrangler d1 export fce-escalquens \
            --remote \
            --output=./prod-data.sql \
            --no-schema \
            --skip-confirmation

      - name: Exporter le schéma de préproduction
        run: |
          npx wrangler d1 export DB \
            --remote \
            --env staging \
            --output=./staging-schema.sql \
            --no-data \
            --skip-confirmation

      - name: Préparer le vidage de staging
        run: |
          python3 scripts/build-staging-clear.py

      - name: Ordonner l'import selon les clés étrangères
        run: |
          python3 scripts/build-ordered-d1-import.py

      - name: Construire une opération atomique
        run: |
          cat \
            staging-clear-data.sql \
            prod-data-ordered.sql \
            > prod-to-staging.sql

          echo "Taille de l'import :"
          ls -lh prod-to-staging.sql

      - name: Vérifications de sécurité
        run: |
          if grep -qiE 'd1_migrations|_cf_KV' staging-clear-data.sql; then
            echo "ERREUR : tentative de modification d'une table système."
            exit 1
          fi

          if grep -qiE 'd1_migrations|_cf_KV|sqlite_sequence|sqlite_stat' prod-data-ordered.sql; then
            echo "ERREUR : le dump contient une table système."
            exit 1
          fi

          echo "Vérifications OK."

      - name: Copier PROD vers PREPROD
        run: |
          npx wrangler d1 execute DB \
            --remote \
            --env staging \
            --file=./prod-to-staging.sql \
            --yes

      - name: Vérifier les clés étrangères
        run: |
          npx wrangler d1 execute DB \
            --remote \
            --env staging \
            --command="PRAGMA foreign_key_check;"

      - name: Vérifier les données copiées
        run: |
          npx wrangler d1 execute DB \
            --remote \
            --env staging \
            --command="SELECT COUNT(*) AS teams FROM teams; SELECT COUNT(*) AS matches FROM matches;"

      - name: Supprimer les copies temporaires
        if: always()
        run: |
          rm -f \
            prod-data.sql \
            prod-data-ordered.sql \
            staging-schema.sql \
            staging-clear-data.sql \
            prod-to-staging.sql

